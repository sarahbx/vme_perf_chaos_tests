[tool.pytest.ini_options]
markers = []
addopts = [
  "--pdbcls=IPython.terminal.debugger:TerminalPdb",
  "--cov-config=pyproject.toml",
  "--cov-report=html",
  "--cov-report=term",
  "--cov=vme_perf_chaos_tests",
]

[tool.coverage.run]
omit = [
  "tests/*",
]

[tool.coverage.report]
fail_under = 90
skip_empty = true

[tool.coverage.html]
directory = ".tests_coverage"

[tool.ruff]
preview = true
line-length = 120
fix = true
output-format = "grouped"

  [tool.ruff.format]
  exclude = [ ".git", ".venv", ".mypy_cache", ".tox", "__pycache__" ]

[tool.mypy]
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = true

[tool.uv]
dev-dependencies = [ "ipdb>=0.13.13", "ipython>=8.12.3" ]

[project]
name = "vme_perf_chaos_tests"
requires-python = ">=3.12.0"
version = "0.0.0"
description = "VME Unified Performance and Chaos Testing Framework"
readme = "README.md"
license = "Apache-2.0"
keywords = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "openshift-python-scale-utilities>=0.1.1.3",
  "openshift-python-wrapper~=11.0.44",
  "pytest>=8.3.3",
  "pytest-order>=1.3.0",
]

  [project.urls]
  homepage = "https://github.com/redhat-performance/vme_perf_chaos_tests"
  "Bug Tracker" = "https://github.com/redhat-performance/vme_perf_chaos_tests/issues"
